# Auto-scaffolded by the self-service portal's New Repository flow
# (see eac-selfservice-portal's _apply_repo_creation) so this repo gets
# on-push docs-as-code sync from day one, matching the other repos in
# the group. On every push to main, fires a repository_dispatch event
# at eac-docs-as-code so it regenerates and republishes docs/ within
# minutes. See eac-docs-as-code's docs-dispatch-receiver.yml for the
# receiving side, and its 4-hour schedule for the backstop that still
# covers this repo even if this workflow or its secret ever breaks.
#
# DOCS_SYNC_TOKEN here is set programmatically at repo-creation time
# (reusing GITHUB_REPO_CREATE_TOKEN's value, which is already scoped to
# All repositories with Contents: Read and write) - not the same
# manually-pasted PAT the other 8 repos share, which is scoped to only
# those 8 by name.

name: Notify docs-as-code

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch docs regeneration to eac-docs-as-code
        run: |
          resp=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DOCS_SYNC_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/sam-tailor/eac-docs-as-code/dispatches \
            -d '{"event_type":"docs-source-updated","client_payload":{"source_repo":"cloudera","ref":"${{ github.ref_name }}","sha":"${{ github.sha }}"}}')
          http_code=$(echo "$resp" | tail -n1)
          body=$(echo "$resp" | sed '$d')
          echo "HTTP status: $http_code"
          if [ -n "$body" ]; then echo "Response body: $body"; fi
          if [ "$http_code" -ge 400 ]; then
            echo "::error::Dispatch to eac-docs-as-code failed with HTTP $http_code - see response body above (never logs the token itself)"
            exit 1
          fi
          echo "Dispatch sent successfully."
